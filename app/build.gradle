plugins { id 'com.android.application' }

android {
    namespace 'com.estiuk.studyxp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.istii.thegreat'
        minSdk 21
        targetSdk 35
        versionCode 6
        versionName '4.1'
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('istii-debug.jks')
            storePassword 'istii123456'
            keyAlias 'istii'
            keyPassword 'istii123456'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable false
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // WebRTC (maintained Android build)
    implementation 'io.github.webrtc-sdk:android:125.6422.07'

    // MQTT signaling
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // MultiDex (minSdk 21 এর জন্য দরকার)
    implementation 'androidx.multidex:multidex:2.0.1'

    // ✅ নতুন — MirrorActivity ও ScreenMirrorService-এর জন্য দরকার
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
}
